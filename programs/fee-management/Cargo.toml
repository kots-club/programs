[package]
name = "fee-management"
version = "1.0.0"
description = "KOTS Fee & Tax Management Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fee_management"

[features]
default = []
# C1 / D11: feature unification requires this in EVERY crate, not just
# kots-common — otherwise one crate compiles Dev while another compiles Main.
realm-main = ["kots-common/realm-main"]
cpi = []
bpf-runtime = ["kots-common/bpf-runtime"]
idl-build = ["anchor-spl/idl-build", "kots-common/idl-build"]
# Network-specific features
# Declared so Anchor's #[program] macro expansion does not trip the
# `unexpected_cfgs` lint (Rust 1.80+). The macro emits #[cfg(feature = "...")]
# for all of these; an undeclared feature is a warning, not an error, but 165 of
# them across the workspace drowned out the warnings that actually mattered.
# (2026-07-22)
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# O32 (2026-07-28). Needed for `onchain::invoke_transfer_checked`, the only CPI
# path that resolves a hooked mint's extra accounts. Was transitive via
# anchor-spl; now direct because this crate names the module. Version and
# features match transfer-hook and lp-position-manager exactly — a mismatch here
# would pull a second copy of the crate into the build.
spl-token-2022 = { version = "6.0.0", features = ["no-entrypoint"] }
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
kots-common = { workspace = true, default-features = false, features = ["cpi"] }
borsh = { workspace = true }
bytemuck = { workspace = true }