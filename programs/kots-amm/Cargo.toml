# DESTINATION: kots-contracts/programs/kots-amm/Cargo.toml
[package]
name = "kots-amm"
version = "0.1.0"
description = "KOTS constant-product KOTS/WSOL pool (program #10)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kots_amm"

[features]
default = []
realm-main = ["kots-common/realm-main"]
cpi = []
bpf-runtime = ["kots-common/bpf-runtime"]
idl-build = ["anchor-spl/idl-build", "kots-common/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
kots-common = { workspace = true, default-features = false, features = ["cpi"] }
# Same helper lp-position-manager uses for hooked TransferChecked.
spl-token-2022 = { version = "6.0.0", features = ["no-entrypoint"] }
