# BUILD FIX (2026-07-23)
#
# `anchor build` failed with:
#     error: failed to parse lock file ... lock file version 4 requires
#     `-Znext-lockfile-bump`
#
# Cargo.lock is v4, which needs cargo >= 1.78. The toolchain doing the build was
# older, because NOTHING here pinned it — see below.
#
# Removed from this file:
#   * a stray top-level `anchor_version` duplicating the one in [toolchain]
#   * `[build] rust-version = "1.75.0"` — DEAD CONFIG. Anchor 0.31.1's
#     BuildConfig has only { verifiable, solana_version, docker_image,
#     bootstrap } and ToolchainConfig only { anchor_version, solana_version,
#     package_manager }. There is no rust version key in either, so Anchor
#     silently ignored this line. It selected nothing; it only documented a
#     requirement that is no longer true (see the MSRV note below).
#
# Added: an explicit `solana_version`, so the platform-tools (and therefore the
# Rust/cargo doing the build) is pinned by the repo instead of inherited from
# whatever each developer happens to have installed.

[toolchain]
anchor_version = "0.31.1"
# MSRV NOTE: Cargo.lock resolves solana-program to 2.3.0, whose declared MSRV is
# 1.79.0 — NOT the 1.75.0 this file used to claim. (1.75.0 was correct for
# solana-program 2.0.17, which is what programs/*/Cargo.toml still ask for; that
# requirement floats and no longer resolves there. See Cargo.toml.)
# Solana 2.1.x platform-tools ships a Rust new enough for both the 1.79 MSRV and
# the v4 lockfile. Verify locally with:  cargo-build-sbf --version
solana_version = "2.1.0"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

# The ID law (CLAUDE.md "Program IDs are permanent"): these addresses are
# FIXED. Every deployment is an upgrade in place. Never regenerate a keypair
# for a program listed here — the keypair IS the ID, and losing it loses the
# address forever.
#
# testnet/mainnet sections are DELETED ON PURPOSE. `anchor keys sync` walks
# BTreeMap<Cluster,..> (Testnet < Mainnet < Devnet < Localnet) and `break
# 'outer`s after the FIRST wrong entry — so with four sections it "synced"
# testnet + mainnet on 2026-07-16 and left devnet on the abandoned v3.9.2 ids.
# It also wrote a DEVNET-derived id into [programs.mainnet], which is exactly
# the realm crossing ops/README.md exists to prevent. Mainnet ids are
# offline-generated at the ceremony (ops/main/README.md) and do NOT belong in
# this file. localnet mirrors devnet so a sync finds nothing to "fix".

